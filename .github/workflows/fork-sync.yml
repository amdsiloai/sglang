name: Fork sync

on:
  schedule:
    # 23:17 UTC, Sunday through Thursday: the evening before each weekday. Off the top of
    # the hour, where GitHub's scheduler is most loaded.
    - cron: "17 23 * * 0-4"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild dev, testing and per-model dev branches
        env:
          FORK_TEAM_LOGINS: ${{ secrets.FORK_TEAM_LOGINS }}
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_REPO: sgl-project/sglang
          FORK_REPO: amdsiloai/sglang
        run: python3 scripts/fork_sync.py

      - name: Report PR conflicts
        if: success()
        continue-on-error: true
        env:
          FORK_TEAM_LOGINS: ${{ secrets.FORK_TEAM_LOGINS }}
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_REPO: sgl-project/sglang
          FORK_REPO: amdsiloai/sglang
        run: python3 scripts/fork_conflicts.py --set unstable --out fork-conflicts

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: branch-build
          path: |
            branch-build.md
            branch-build.json
            fork-conflicts.md
            fork-conflicts.json
          retention-days: 30
